name: Verify published Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_AVD_HOME: /tmp/devpath-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download published APK
        run: curl --fail --location --retry 3 https://github.com/arshiaamirabadi-ui/devpath/releases/download/android-v1.1.0/DevPath-1.1.0.apk --output DevPath.apk
      - name: Prepare emulator
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' </dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name devpath-test --package 'system-images;android-35;google_apis;x86_64' --device pixel_5 --force
      - name: Boot emulator and verify offline launch
        env:
          APK_UNDER_TEST: DevPath.apk
        run: |
          mkdir -p android-smoke
          "$ANDROID_HOME/emulator/emulator" -avd devpath-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > android-smoke/emulator.log 2>&1 &
          EMULATOR_PID=$!
          sleep 5
          if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat android-smoke/emulator.log; exit 1; fi
          if ! timeout 150 adb wait-for-device; then cat android-smoke/emulator.log; exit 1; fi
          for n in $(seq 1 80); do
            if adb shell getprop sys.boot_completed | grep -q 1; then break; fi
            sleep 3
          done
          if ! adb shell getprop sys.boot_completed | grep -q 1; then cat android-smoke/emulator.log; exit 1; fi
          adb shell input keyevent 82
          bash scripts/android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-apk-smoke
          path: android-smoke/
          retention-days: 14

